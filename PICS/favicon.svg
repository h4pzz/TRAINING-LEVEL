<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="uhGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="64" height="64" rx="16" fill="url(#uhGrad)"/>
  
  <!-- Subtle border highlight -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Rotor blade / aviation wing accent arch -->
  <path d="M12 18 C24 12, 40 12, 52 18" fill="none" stroke="#93c5fd" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.75"/>

  <!-- Bold "UH" Letters in white & clean aviation contrast -->
  <text x="32" y="44" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', Arial, sans-serif" 
        font-size="28" 
        font-weight="900" 
        letter-spacing="0.5" 
        fill="#ffffff" 
        text-anchor="middle" 
        filter="url(#shadow)">UH</text>

  <!-- Small gold/amber rotor tip or aviation dot -->
  <circle cx="51" cy="18" r="2" fill="#fbbf24"/>
</svg>
